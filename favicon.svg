<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background with rounded corners -->
    <rect width="32" height="32" rx="6" fill="url(#bg-gradient)"/>

    <!-- Duck body -->
    <ellipse cx="16" cy="19" rx="9" ry="7" fill="white"/>

    <!-- Duck head -->
    <circle cx="21" cy="12" r="5.5" fill="white"/>

    <!-- Duck eye -->
    <circle cx="23" cy="11" r="1.3" fill="#0d9488"/>

    <!-- Duck beak -->
    <path d="M25.5 12.5 L30 13.5 L25.5 15 Z" fill="#f59e0b"/>

    <!-- Duck wing -->
    <ellipse cx="13.5" cy="19" rx="4.5" ry="3.5" fill="#e2e8f0"/>
</svg>
