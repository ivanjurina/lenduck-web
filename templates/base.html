<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lenduck{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-forest: #2d5a3d;
            --color-forest-dark: #1e3d29;
            --color-forest-light: #3d7a52;
            --color-sage: #7c9a82;
            --color-sage-light: #a8c4ad;
            --color-sage-pale: #d4e4d7;
            --color-cream: #faf8f3;
            --color-cream-dark: #f0ebe0;
            --color-brown: #5c4d3c;
            --color-brown-light: #8b7355;
            --color-earth: #c4a77d;
            --color-moss: #4a7c59;
            --color-leaf: #228b22;
            --color-text: #3d3d3d;
            --color-text-light: #6b6b6b;
            --color-text-inverse: #faf8f3;
            --color-border: #d4d4c4;
            --color-border-dark: #4a5a4d;
            --color-error: #c44536;
            --color-success: #2d5a3d;
            --font-main: 'Nunito', sans-serif;
            --shadow-soft: 0 4px 20px rgba(45, 90, 61, 0.08);
            --shadow-medium: 0 8px 30px rgba(45, 90, 61, 0.12);
            --shadow-large: 0 16px 50px rgba(45, 90, 61, 0.15);
            --radius-soft: 20px;
            --radius-round: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background: var(--color-cream);
            color: var(--color-text);
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-forest-dark);
        }

        /* Navigation */
        nav {
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 248, 243, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(124, 154, 130, 0.2);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-forest);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--color-forest);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius-round);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: var(--font-main);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-forest), var(--color-moss));
            color: white;
            box-shadow: 0 4px 15px rgba(45, 90, 61, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45, 90, 61, 0.4);
        }

        .btn-secondary {
            background: var(--color-cream);
            color: var(--color-forest);
            border: 2px solid var(--color-sage);
        }

        .btn-secondary:hover {
            background: var(--color-sage-pale);
            border-color: var(--color-forest);
        }

        .btn-full {
            width: 100%;
        }

        /* Main Content */
        main {
            padding-top: 100px;
            min-height: calc(100vh - 100px);
        }

        /* Auth Container */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-medium);
            padding: 48px;
            width: 100%;
            max-width: 440px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--color-text-light);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--color-border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: var(--font-main);
            transition: all 0.3s;
            background: var(--color-cream);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-forest);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Flash Messages */
        .flash-messages {
            margin-bottom: 24px;
        }

        .flash {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .flash-error {
            background: #fef2f2;
            color: var(--color-error);
            border: 1px solid #fecaca;
        }

        .flash-success {
            background: #f0fdf4;
            color: var(--color-success);
            border: 1px solid #bbf7d0;
        }

        /* Links */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--color-text-light);
        }

        .auth-footer a {
            color: var(--color-forest);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Dashboard Styles */
        .dashboard-header {
            background: linear-gradient(135deg, var(--color-forest), var(--color-moss));
            color: white;
            padding: 60px 0;
            margin-top: -20px;
        }

        .dashboard-title {
            color: white;
            font-size: 2rem;
        }

        .dashboard-subtitle {
            color: var(--color-sage-light);
            margin-top: 8px;
        }

        .dashboard-content {
            padding: 40px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-soft);
            padding: 28px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-forest);
        }

        .stat-label {
            color: var(--color-text-light);
            font-weight: 600;
            margin-top: 4px;
        }

        /* Tables */
        .data-table {
            background: white;
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            margin-bottom: 32px;
        }

        .table-header {
            background: var(--color-sage-pale);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h3 {
            font-size: 1.1rem;
        }

        .table-content {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }

        th {
            background: var(--color-cream);
            font-weight: 700;
            color: var(--color-forest-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover td {
            background: var(--color-cream);
        }

        td {
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-admin {
            background: var(--color-forest);
            color: white;
        }

        .badge-user {
            background: var(--color-sage-pale);
            color: var(--color-forest-dark);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            font-family: var(--font-main);
            font-weight: 600;
            color: var(--color-text-light);
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }

        .tab:hover {
            color: var(--color-forest);
        }

        .tab.active {
            color: var(--color-forest);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-forest);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 16px;
            }

            .auth-card {
                padding: 32px 24px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="logo">
                    <img src="/logo.png" alt="Lenduck" class="logo-icon">
                    <span class="logo-text">Lenduck</span>
                </a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    {% if session.user_id %}
                        {% if session.is_admin %}
                            <a href="{{ url_for('admin_dashboard') }}">Admin</a>
                        {% endif %}
                        <a href="{{ url_for('dashboard') }}">Dashboard</a>
                        <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
                    {% else %}
                        <a href="{{ url_for('login') }}">Login</a>
                        <a href="{{ url_for('signup') }}" class="btn btn-primary">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
