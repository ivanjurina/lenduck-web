<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="forestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a3d"/>
      <stop offset="100%" style="stop-color:#4a7c59"/>
    </linearGradient>
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9a82"/>
      <stop offset="100%" style="stop-color:#a8c4ad"/>
    </linearGradient>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4a77d"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c9a82"/>
      <stop offset="100%" style="stop-color:#2d5a3d"/>
    </linearGradient>
    <linearGradient id="arrowGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a3d"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2d5a3d" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLarge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2d5a3d" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d5a3d"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b7355"/>
    </marker>
  </defs>

  <!-- Background subtle pattern -->
  <rect width="1000" height="400" fill="#faf8f3"/>

  <!-- Column Labels -->
  <text x="130" y="35" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#1e3d29" text-anchor="middle">ACCOUNTING SOFTWARE</text>
  <text x="130" y="52" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">Your financial data</text>

  <text x="500" y="35" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#1e3d29" text-anchor="middle">LENDUCK PLATFORM</text>
  <text x="500" y="52" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">AI-powered analysis</text>

  <text x="870" y="35" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#1e3d29" text-anchor="middle">LENDER NETWORK</text>
  <text x="870" y="52" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">Compete for your business</text>

  <!-- Left Column - Accounting Software -->
  <g filter="url(#shadow)">
    <!-- QuickBooks -->
    <rect x="40" y="75" width="180" height="70" rx="12" fill="white" stroke="#7c9a82" stroke-width="2"/>
    <rect x="55" y="90" width="40" height="40" rx="8" fill="url(#sageGradient)"/>
    <text x="75" y="116" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">QB</text>
    <text x="115" y="108" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">QuickBooks</text>
    <text x="115" y="125" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Cloud accounting</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Xero -->
    <rect x="40" y="160" width="180" height="70" rx="12" fill="white" stroke="#7c9a82" stroke-width="2"/>
    <rect x="55" y="175" width="40" height="40" rx="8" fill="url(#sageGradient)"/>
    <text x="75" y="201" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">X</text>
    <text x="115" y="193" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">Xero</text>
    <text x="115" y="210" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Online platform</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Sage -->
    <rect x="40" y="245" width="180" height="70" rx="12" fill="white" stroke="#7c9a82" stroke-width="2"/>
    <rect x="55" y="260" width="40" height="40" rx="8" fill="url(#sageGradient)"/>
    <text x="75" y="286" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">S</text>
    <text x="115" y="278" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">Sage</text>
    <text x="115" y="295" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Business software</text>
  </g>

  <g filter="url(#shadow)">
    <!-- More -->
    <rect x="40" y="330" width="180" height="50" rx="12" fill="white" stroke="#d4d4c4" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="360" font-family="Nunito, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">+ More on request</text>
  </g>

  <!-- Animated connection lines left -->
  <g>
    <path d="M 220 110 Q 280 110 310 195" stroke="url(#arrowGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 220 195 L 310 195" stroke="url(#arrowGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 220 280 Q 280 280 310 195" stroke="url(#arrowGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Decorative dots -->
    <circle cx="265" cy="150" r="4" fill="#7c9a82"/>
    <circle cx="265" cy="195" r="4" fill="#2d5a3d"/>
    <circle cx="265" cy="240" r="4" fill="#7c9a82"/>
  </g>

  <!-- Arrow label left -->
  <rect x="248" y="310" width="100" height="24" rx="12" fill="#d4e4d7"/>
  <text x="298" y="326" font-family="Nunito, sans-serif" font-size="10" font-weight="600" fill="#2d5a3d" text-anchor="middle">Encrypted sync</text>

  <!-- Center - Lenduck Hub -->
  <g filter="url(#shadowLarge)">
    <rect x="330" y="80" width="340" height="240" rx="20" fill="url(#forestGradient)"/>

    <!-- Glow effect -->
    <rect x="330" y="80" width="340" height="240" rx="20" fill="url(#forestGradient)" filter="url(#glow)" opacity="0.3"/>

    <!-- Icon -->
    <circle cx="500" cy="130" r="30" fill="rgba(255,255,255,0.15)"/>
    <g transform="translate(485, 115)">
      <circle cx="15" cy="15" r="8" stroke="white" stroke-width="2" fill="none"/>
      <path d="M15 2v6M15 22v6M2 15h6M22 15h6M5.5 5.5l4 4M18.5 18.5l4 4M5.5 24.5l4-4M18.5 5.5l4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Title -->
    <text x="500" y="180" font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Smart Matching Engine</text>
    <text x="500" y="200" font-family="Nunito, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">We analyze and normalize your data</text>

    <!-- Features -->
    <g transform="translate(360, 220)">
      <circle cx="10" cy="10" r="8" fill="rgba(255,255,255,0.2)"/>
      <path d="M6 10l3 3 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="14" font-family="Nunito, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Financial health score</text>
    </g>
    <g transform="translate(360, 245)">
      <circle cx="10" cy="10" r="8" fill="rgba(255,255,255,0.2)"/>
      <path d="M6 10l3 3 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="14" font-family="Nunito, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Cash flow analysis</text>
    </g>
    <g transform="translate(520, 220)">
      <circle cx="10" cy="10" r="8" fill="rgba(255,255,255,0.2)"/>
      <path d="M6 10l3 3 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="14" font-family="Nunito, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Risk profiling</text>
    </g>
    <g transform="translate(520, 245)">
      <circle cx="10" cy="10" r="8" fill="rgba(255,255,255,0.2)"/>
      <path d="M6 10l3 3 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="14" font-family="Nunito, sans-serif" font-size="11" fill="rgba(255,255,255,0.95)">Lender matching</text>
    </g>

    <!-- Bottom badge -->
    <rect x="420" y="280" width="160" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
    <text x="500" y="299" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Your data stays private</text>
  </g>

  <!-- Connection lines right -->
  <g>
    <path d="M 670 195 Q 730 195 760 110" stroke="url(#arrowGradient2)" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead2)"/>
    <path d="M 670 195 L 760 195" stroke="url(#arrowGradient2)" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead2)"/>
    <path d="M 670 195 Q 730 195 760 280" stroke="url(#arrowGradient2)" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead2)"/>

    <!-- Decorative dots -->
    <circle cx="715" cy="150" r="4" fill="#c4a77d"/>
    <circle cx="715" cy="195" r="4" fill="#8b7355"/>
    <circle cx="715" cy="240" r="4" fill="#c4a77d"/>
  </g>

  <!-- Arrow label right -->
  <rect x="655" y="310" width="120" height="24" rx="12" fill="#f5efe6"/>
  <text x="715" y="326" font-family="Nunito, sans-serif" font-size="10" font-weight="600" fill="#5c4d3c" text-anchor="middle">Anonymized profiles</text>

  <!-- Right Column - Lenders -->
  <g filter="url(#shadow)">
    <!-- Traditional Banks -->
    <rect x="780" y="75" width="180" height="70" rx="12" fill="white" stroke="#c4a77d" stroke-width="2"/>
    <rect x="795" y="90" width="40" height="40" rx="8" fill="url(#earthGradient)"/>
    <g transform="translate(803, 100)">
      <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="1.5" fill="none"/>
      <path d="M2 12l10 5 10-5M2 17l10 5 10-5" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
    <text x="855" y="108" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">Traditional Banks</text>
    <text x="855" y="125" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Major & regional</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Alternative Lenders -->
    <rect x="780" y="160" width="180" height="70" rx="12" fill="white" stroke="#c4a77d" stroke-width="2"/>
    <rect x="795" y="175" width="40" height="40" rx="8" fill="url(#earthGradient)"/>
    <g transform="translate(803, 183)">
      <rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="1.5" fill="none"/>
      <path d="M8 12h8M12 8v8" stroke="white" stroke-width="1.5"/>
    </g>
    <text x="855" y="193" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">Alternative Lenders</text>
    <text x="855" y="210" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Fintech & P2P</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Credit Unions -->
    <rect x="780" y="245" width="180" height="70" rx="12" fill="white" stroke="#c4a77d" stroke-width="2"/>
    <rect x="795" y="260" width="40" height="40" rx="8" fill="url(#earthGradient)"/>
    <g transform="translate(803, 268)">
      <circle cx="12" cy="8" r="5" stroke="white" stroke-width="1.5" fill="none"/>
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
    <text x="855" y="278" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#3d3d3d">Credit Unions</text>
    <text x="855" y="295" font-family="Nunito, sans-serif" font-size="11" fill="#6b6b6b">Member-owned</text>
  </g>

  <g filter="url(#shadow)">
    <!-- More lenders -->
    <rect x="780" y="330" width="180" height="50" rx="12" fill="white" stroke="#d4d4c4" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="870" y="360" font-family="Nunito, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">+ Growing network</text>
  </g>
</svg>
